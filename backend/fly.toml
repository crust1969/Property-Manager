app = "vermieter-manager-api"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  DATABASE_PATH = "/data/app.db"
  PORT = "3000"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "10s"
  timeout = "5s"
  grace_period = "15s"
  method = "GET"
  path = "/health"

[mounts]
  source = "data"
  destination = "/data"
